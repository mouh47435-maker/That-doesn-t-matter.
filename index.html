<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>0xCrack - مجتمع الأمن السيبراني</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-gray-200 font-sans min-h-screen flex flex-col">

    <!-- الهيدر / القائمة العلوية -->
    <header class="border-b border-zinc-800 bg-zinc-950 p-4 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-red-600 tracking-wider">0xCrack</h1>
            <div id="auth-buttons" class="flex gap-3">
                <button onclick="toggleAuthModal()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded text-sm transition">تسجيل الدخول / حساب جديد</button>
            </div>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="user-email" class="text-sm text-zinc-400"></span>
                <button onclick="openTopicModal()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm font-bold">+ موضوع جديد</button>
                <button onclick="logout()" class="text-xs text-zinc-500 hover:text-red-500">خروج</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-6xl mx-auto w-full p-4 flex-grow space-y-8">
        
        <!-- قسم الأقسام -->
        <section>
            <h2 class="text-xl font-bold text-white mb-4 border-r-4 border-red-600 pr-2">منتديات الأمن السيبراني</h2>
            <div id="categories-container" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <p class="text-zinc-500 col-span-3">جاري تحميل الأقسام...</p>
            </div>
        </section>

        <!-- قسم أحدث المواضيع -->
        <section>
            <h2 class="text-xl font-bold text-white mb-4 border-r-4 border-red-600 pr-2">أحدث المواضيع</h2>
            <div id="topics-container" class="space-y-3">
                <p class="text-zinc-500">جاري تحميل المواضيع...</p>
            </div>
        </section>

    </main>

    <!-- نافذة التسجيل / الدخول (Auth Modal) -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-lg w-full max-w-md relative">
            <button onclick="toggleAuthModal()" class="absolute top-3 left-3 text-zinc-500 hover:text-white">✕</button>
            <h3 class="text-xl font-bold text-white mb-4">الدخول / التسجيل</h3>
            <input type="email" id="auth-email" placeholder="البريد الإلكتروني" class="w-full p-2.5 mb-3 bg-zinc-800 text-white rounded border border-zinc-700 focus:outline-none focus:border-red-600">
            <input type="password" id="auth-password" placeholder="كلمة المرور" class="w-full p-2.5 mb-4 bg-zinc-800 text-white rounded border border-zinc-700 focus:outline-none focus:border-red-600">
            <div class="flex gap-2">
                <button onclick="handleAuth('login')" class="w-1/2 bg-zinc-800 hover:bg-zinc-700 text-white py-2 rounded">دخول</button>
                <button onclick="handleAuth('signup')" class="w-1/2 bg-red-600 hover:bg-red-700 text-white py-2 rounded">حساب جديد</button>
            </div>
            <p id="auth-error" class="text-red-500 text-xs mt-3 hidden"></p>
        </div>
    </div>

    <!-- نافذة إضافة موضوع جديد (Topic Modal) -->
    <div id="topic-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-lg w-full max-w-lg relative">
            <button onclick="closeTopicModal()" class="absolute top-3 left-3 text-zinc-500 hover:text-white">✕</button>
            <h3 class="text-xl font-bold text-white mb-4">كتابة موضوع جديد</h3>
            
            <input type="text" id="topic-title" placeholder="عنوان الموضوع" class="w-full p-2.5 mb-3 bg-zinc-800 text-white rounded border border-zinc-700 focus:outline-none focus:border-red-600">
            
            <select id="topic-category" class="w-full p-2.5 mb-3 bg-zinc-800 text-white rounded border border-zinc-700 focus:outline-none focus:border-red-600">
                <!-- تحميل الأقسام داخل القائمة -->
            </select>
            
            <textarea id="topic-content" rows="5" placeholder="محتوى الموضوع..." class="w-full p-2.5 mb-4 bg-zinc-800 text-white rounded border border-zinc-700 focus:outline-none focus:border-red-600"></textarea>
            
            <div class="flex justify-end gap-2">
                <button onclick="closeTopicModal()" class="px-4 py-2 text-zinc-400 hover:text-white">إلغاء</button>
                <button onclick="submitNewTopic()" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white rounded font-bold">نشر الموضوع</button>
            </div>
        </div>
    </div>

    <script>
        // ضع رابط URL ومفتاح anon الخاص بمشروعك هنا:
        const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co'; 
        const SUPABASE_KEY = 'YOUR-ANON-KEY'; 

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // التهيئة عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            checkUserSession();
            loadCategories();
            loadTopics();
        });

        // فحص الجلسة وتسجيل الدخول
        async function checkUserSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-buttons').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('user-email').innerText = session.user.email;
            } else {
                document.getElementById('auth-buttons').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
            }
        }

        // تسجيل الدخول أو إنشاء حساب
        async function handleAuth(type) {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errorElement = document.getElementById('auth-error');
            errorElement.classList.add('hidden');

            let res;
            if (type === 'login') {
                res = await _supabase.auth.signInWithPassword({ email, password });
            } else {
                res = await _supabase.auth.signUp({ email, password });
            }

            if (res.error) {
                errorElement.innerText = res.error.message;
                errorElement.classList.remove('hidden');
            } else {
                toggleAuthModal();
                checkUserSession();
            }
        }

        async function logout() {
            await _supabase.auth.signOut();
            checkUserSession();
        }

        // تحميل الأقسام من قاعدة البيانات
        async function loadCategories() {
            const { data, error } = await _supabase.from('categories').select('*');
            const container = document.getElementById('categories-container');
            const select = document.getElementById('topic-category');
            
            if (error || !data || !data.length) {
                container.innerHTML = '<p class="text-zinc-500 col-span-3">لا توجد أقسام أو تعذر الاتصال.</p>';
                return;
            }

            container.innerHTML = '';
            select.innerHTML = '';

            data.forEach(cat => {
                container.innerHTML += `
                    <div class="bg-zinc-900 border border-zinc-800 p-4 rounded hover:border-red-600 cursor-pointer transition">
                        <h3 class="font-bold text-white text-lg">${cat.name}</h3>
                        <p class="text-zinc-400 text-sm mt-1">${cat.description || ''}</p>
                    </div>
                `;
                select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
            });
        }

        // تحميل المواضيع
        async function loadTopics() {
            const { data, error } = await _supabase.from('topics').select('*, categories(name)').order('created_at', { ascending: false });
            const container = document.getElementById('topics-container');

            if (error || !data || !data.length) {
                container.innerHTML = '<p class="text-zinc-500">لا توجد مواضيع مضافة بعد.</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(topic => {
                container.innerHTML += `
                    <div class="bg-zinc-900 border border-zinc-800 p-4 rounded hover:border-zinc-700 transition">
                        <span class="text-xs bg-red-950 text-red-400 px-2 py-0.5 rounded">${topic.categories?.name || 'عام'}</span>
                        <h3 class="font-bold text-white text-lg mt-2">${topic.title}</h3>
                        <p class="text-zinc-400 text-sm mt-1 line-clamp-2">${topic.content}</p>
                    </div>
                `;
            });
        }

        // إدارة النوافذ المنبثقة
        function toggleAuthModal() {
            document.getElementById('auth-modal').classList.toggle('hidden');
        }

        function openTopicModal() {
            document.getElementById('topic-modal').classList.remove('hidden');
        }

        function closeTopicModal() {
            document.getElementById('topic-modal').classList.add('hidden');
        }

        // إرسال موضوع جديد إلى Supabase
        async function submitNewTopic() {
            const title = document.getElementById('topic-title').value;
            const category_id = document.getElementById('topic-category').value;
            const content = document.getElementById('topic-content').value;

            const { data: { user } } = await _supabase.auth.getUser();

            if (!user) {
                alert('يرجى تسجيل الدخول أولاً!');
                return;
            }

            if (!title || !content) {
                alert('يرجى ملء جميع الحقول!');
                return;
            }

            const { error } = await _supabase.from('topics').insert([
                { title, category_id, content, user_id: user.id }
            ]);

            if (error) {
                alert('حدث خطأ أثناء النشر: ' + error.message);
            } else {
                alert('تم نشر الموضوع بنجاح!');
                document.getElementById('topic-title').value = '';
                document.getElementById('topic-content').value = '';
                closeTopicModal();
                loadTopics();
            }
        }
    </script>
</body>
</html>
