<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>0xCRACK — مجتمع الأمن السيبراني</title>

  <meta
    name="description"
    content="0xCRACK — مجتمع عربي للأمن السيبراني والبرمجة"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #070b09;
      color: #e8fff1;
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* NAVBAR */

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 9, 7, 0.96);
      border-bottom: 1px solid #173b27;
      backdrop-filter: blur(10px);
    }

    .nav-inner {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #fff;
      letter-spacing: 1px;
    }

    .logo span {
      color: #00ff88;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-links button {
      background: transparent;
      color: #b9cfc1;
      border: 1px solid transparent;
      padding: 9px 13px;
      border-radius: 8px;
    }

    .nav-links button:hover {
      color: #00ff88;
      border-color: #174f31;
    }

    .user-info {
      color: #00ff88;
      font-size: 13px;
      display: none;
    }

    /* HERO */

    .hero {
      max-width: 1200px;
      margin: 30px auto 20px;
      padding: 45px 25px;
      text-align: center;
      border: 1px solid #143d27;
      border-radius: 16px;
      background:
        radial-gradient(
          circle at center,
          rgba(0,255,136,.08),
          transparent 55%
        ),
        #0a100d;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero h1 span {
      color: #00ff88;
    }

    .hero p {
      color: #91a99a;
      font-size: 16px;
    }

    /* LAYOUT */

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px 50px;

      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;

      direction: ltr;
    }

    .sidebar,
    .main {
      direction: rtl;
    }

    .sidebar {
      background: #0b110e;
      border: 1px solid #163a26;
      border-radius: 12px;
      padding: 18px;
      height: fit-content;
    }

    .sidebar h3 {
      color: #00ff88;
      margin-bottom: 15px;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .category-btn {
      width: 100%;
      text-align: right;
      background: #0e1511;
      color: #c7d8cc;
      border: 1px solid #183a27;
      padding: 12px;
      border-radius: 8px;
      transition: .2s;
    }

    .category-btn:hover {
      color: #00ff88;
      border-color: #00ff88;
      transform: translateX(-2px);
    }

    .category-btn.active {
      color: #00ff88;
      border-color: #00ff88;
    }

    .main {
      min-width: 0;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
    }

    .section-title h2 {
      color: #fff;
    }

    .topics-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .topic-card {
      background: #0b110e;
      border: 1px solid #173b27;
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: .2s;
    }

    .topic-card:hover {
      border-color: #00ff88;
      transform: translateY(-2px);
    }

    .topic-card h3 {
      color: #fff;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .topic-preview {
      color: #91a99a;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .topic-meta {
      color: #647a6b;
      font-size: 12px;
    }

    .empty {
      background: #0b110e;
      border: 1px dashed #234d34;
      border-radius: 12px;
      padding: 35px;
      text-align: center;
      color: #819589;
    }

    /* BUTTONS */

    .primary-btn {
      background: #00ff88;
      color: #001b0c;
      border: none;
      padding: 11px 17px;
      border-radius: 8px;
      font-weight: bold;
    }

    .primary-btn:hover {
      opacity: .85;
    }

    .danger-btn {
      background: transparent;
      color: #ff7070;
      border: 1px solid #642929;
      padding: 9px 13px;
      border-radius: 8px;
    }

    /* PAGES */

    .page-section {
      display: none;
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px 50px;
    }

    .back-btn {
      background: #0c130f;
      color: #00ff88;
      border: 1px solid #1c5635;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 18px;
    }

    .back-btn:hover {
      border-color: #00ff88;
    }

    .category-header {
      background: #0b110e;
      border: 1px solid #173b27;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 18px;
    }

    .category-header h1 {
      color: #00ff88;
      margin-bottom: 8px;
    }

    .category-header p {
      color: #91a99a;
    }

    .single-topic {
      background: #0b110e;
      border: 1px solid #173b27;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .single-topic h1 {
      color: #00ff88;
      margin-bottom: 18px;
      font-size: 27px;
    }

    .single-topic-content {
      white-space: pre-wrap;
      color: #d6e6db;
      line-height: 1.9;
      font-size: 16px;
    }

    .single-topic-date {
      display: block;
      color: #63796a;
      margin-top: 20px;
      font-size: 12px;
    }

    .replies-title {
      color: #00ff88;
      margin-bottom: 14px;
    }

    .reply-card {
      background: #0b110e;
      border: 1px solid #173b27;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 10px;
    }

    .reply-content {
      white-space: pre-wrap;
      line-height: 1.8;
      color: #d8e5dc;
    }

    .reply-date {
      display: block;
      color: #63796a;
      font-size: 11px;
      margin-top: 8px;
    }

    .reply-box {
      background: #0b110e;
      border: 1px solid #173b27;
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
    }

    .reply-box textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      background: #070b09;
      color: white;
      border: 1px solid #244833;
      border-radius: 9px;
      padding: 12px;
      outline: none;
      margin-bottom: 10px;
    }

    .reply-box textarea:focus {
      border-color: #00ff88;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0,0,0,.75);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      background: #0b110e;
      border: 1px solid #1c5635;
      border-radius: 14px;
      padding: 25px;
    }

    .modal-box h2 {
      color: #00ff88;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      color: #b9cfc1;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      background: #070b09;
      color: white;
      border: 1px solid #244833;
      border-radius: 8px;
      padding: 12px;
      outline: none;
    }

    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #00ff88;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-start;
      margin-top: 10px;
    }

    .close-btn {
      background: transparent;
      color: #aaa;
      border: 1px solid #333;
      padding: 10px 15px;
      border-radius: 8px;
    }

    /* TOAST */

    #toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 2000;

      background: #0b110e;
      color: #00ff88;
      border: 1px solid #00ff88;

      padding: 13px 18px;
      border-radius: 9px;

      display: none;
      max-width: 90%;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .container {
        grid-template-columns: 1fr;
      }

      .sidebar {
        order: 1;
      }

      .main {
        order: 2;
      }

      .nav-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->

  <nav>
    <div class="nav-inner">

      <div class="logo">
        <span>0x</span>CRACK
      </div>

      <div class="nav-links">

        <button onclick="showHome()">
          المنتدى
        </button>

        <button onclick="openTopicModal()">
          + موضوع جديد
        </button>

        <button id="authButton" onclick="openAuthModal()">
          تسجيل الدخول
        </button>

        <button
          id="logoutButton"
          class="danger-btn"
          onclick="logout()"
          style="display:none;"
        >
          تسجيل الخروج
        </button>

        <span id="userInfo" class="user-info"></span>

      </div>

    </div>
  </nav>


  <!-- HOME -->

  <div id="home">

    <section class="hero">

      <h1>
        مرحباً بك في
        <span>0xCRACK</span>
      </h1>

      <p>
        مجتمع عربي للأمن السيبراني، Linux، البرمجة والتقنية
      </p>

    </section>


    <div class="container">

      <!-- SIDEBAR -->

      <aside class="sidebar">

        <h3>الأقسام</h3>

        <div id="categoryList" class="category-list">
          جاري تحميل الأقسام...
        </div>

      </aside>


      <!-- TOPICS -->

      <main class="main">

        <div class="section-title">

          <h2>
            آخر النقاشات
          </h2>

          <button
            class="primary-btn"
            onclick="openTopicModal()"
          >
            + موضوع جديد

        <div id="topicsList" class="topics-list">

        </div>

      </main>

  </div>


  <!-- CATEGORY PAGE -->

  <section id="categoryPage" class="page-section">

      class="back-btn"

    >

    </button>

    <div class="category-header">

      جاري تحميل النقاشات...

  </section>


  <!-- TOPIC PAGE -->

  <section id="topicPage" class="page-section">

    <button
      class="back-btn"
      onclick="backToCategory()"
    >
      ← رجوع للقسم
    </button>

    <article class="single-topic">

      <h1 id="singleTopicTitle"></h1>

    <h2 class="replies-title">

    </h2>

      <textarea
        id="replyContent"

  <!-- AUTH MODAL -->

  <div id="authModal" class="modal">

    <div class="modal-box">

      <h2 id="authTitle">

        </label>

        <label>

        </label>

          type="password"

      <div class="modal-actions">

        <button
          class="primary-btn"

        </button>

        <button

          إلغاء

      </div>

      <p
        style="margin-top:15px;color:#819589;font-size:13px;"
      >
        التسجيل يتم عبر Supabase Auth.
      </p>

    </div>

  </div>


  <!-- CREATE TOPIC MODAL -->

  <div id="topicModal" class="modal">

    <div class="modal-box">

      <h2>
        إنشاء موضوع جديد
      </h2>


      <div class="form-group">

        <label>
          القسم
        </label>

        <select id="topicCategory">

          <option value="">
            جاري تحميل الأقسام...
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>
          عنوان الموضوع
        </label>

        <input
          type="text"
          id="topicTitle"
          placeholder="اكتب عنوان الموضوع..."
        >

      </div>


      <div class="form-group">

        <label>
          المحتوى
        </label>

        <textarea
          id="topicContent"
          placeholder="اكتب محتوى الموضوع..."
        ></textarea>

      </div>


      <div class="modal-actions">

        <button
          class="primary-btn"
          onclick="createTopic()"
        >
          نشر الموضوع
        </button>

        <button
          class="close-btn"
          onclick="closeModal('topicModal')"
        >
          إلغاء
        </button>

      </div>

    </div>

  </div>


  <!-- TOAST -->

  <div id="toast"></div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://lcdkvsoztwyuaiizndfl.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_hRQIGaC-5q8lhJnMZsWL3Q_B0v6IfDQ";

  const db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     GLOBAL VARIABLES
  ========================= */

  let currentCategoryId = null;
  let currentTopicId = null;


  /* =========================
     TOAST
  ========================= */

  function showToast(message) {

    const toast =
      document.getElementById("toast");

    toast.textContent = message;

    toast.style.display = "block";

    setTimeout(function () {
      toast.style.display = "none";
    }, 3000);
  }


  /* =========================
     MODALS
  ========================= */

  function openModal(id) {

    document.getElementById(id).style.display =
      "flex";
  }


  function closeModal(id) {

    document.getElementById(id).style.display =
      "none";
  }


  /* =========================
     AUTH
  ========================= */

  async function openAuthModal() {

    const {
      data: { user }
    } = await db.auth.getUser();

    if (user) {
      showToast("أنت مسجل الدخول بالفعل.");
      return;
    }

    openModal("authModal");
  }


  async function login() {

    const email =
      document.getElementById("authEmail").value.trim();

    const password =
      document.getElementById("authPassword").value;

    if (!email || !password) {

      showToast(
        "أدخل البريد الإلكتروني وكلمة المرور."
      );

      return;
    }


    const result =
      await db.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (result.error) {

      console.error(result.error);

      showToast(
        "فشل تسجيل الدخول: " +
        result.error.message
      );

      return;
    }


    closeModal("authModal");

    showToast("تم تسجيل الدخول ✅");

    updateUserUI();

  }


  async function logout() {

    const result =
      await db.auth.signOut();

    if (result.error) {

      console.error(result.error);

      showToast("تعذر تسجيل الخروج.");

      return;
    }

    showToast("تم تسجيل الخروج.");

    updateUserUI();

  }


  async function updateUserUI() {

    const {
      data: { user }
    } = await db.auth.getUser();


    const authButton =
      document.getElementById("authButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const userInfo =
      document.getElementById("userInfo");


    if (user) {

      authButton.style.display = "none";

      logoutButton.style.display = "inline-block";

      userInfo.style.display = "inline-block";

      userInfo.textContent =
        user.email || "مستخدم";

    } else {

      authButton.style.display =
        "inline-block";

      logoutButton.style.display =
        "none";

      userInfo.style.display =
        "none";

    }

  }


  /* =========================
     CATEGORIES
  ========================= */

  async function loadCategories() {

    const select =
      document.getElementById("topicCategory");

    const list =
      document.getElementById("categoryList");


    const result =
      await db
        .from("categories")
        .select("id,name,slug,description")
        .order("id");


    if (result.error) {

      console.error(result.error);

      if (select) {

        select.innerHTML =
          '<option value="">تعذر تحميل الأقسام</option>';

      }

      if (list) {

        list.innerHTML =
          '<div style="color:#ff7070;font-size:13px;">تعذر تحميل الأقسام</div>';

      }

      return;
    }


    const categories =
      result.data || [];


    /* SELECT */

    if (select) {

      select.innerHTML =
        '<option value="">اختر القسم</option>';

      categories.forEach(function(category) {

        const option =
          document.createElement("option");

        option.value =
          category.id;

        option.textContent =
          category.name;

        select.appendChild(option);

      });

    }


    /* SIDEBAR */

    if (list) {

      list.innerHTML = "";

      if (categories.length === 0) {

        list.innerHTML =
          '<div class="empty">لا توجد أقسام.</div>';

        return;
      }


      categories.forEach(function(category) {

        const button =
          document.createElement("button");

        button.className =
          "category-btn";

        button.textContent =
          "▸ " + category.name;

        button.onclick = function() {

          openCategory(
            category.id,
            category.name,
            category.description
          );

        };

        list.appendChild(button);

      });

    }

  }


  /* =========================
     HOME TOPICS
  ========================= */

  async function loadTopics() {

    const container =
      document.getElementById("topicsList");

    container.innerHTML =
      '<div class="empty">جاري تحميل النقاشات...</div>';


    const result =
      await db
        .from("topics")
        .select(
          "id,title,content,created_at,category_id"
        )
        .order(
          "created_at",
          { ascending: false }
        );


    if (result.error) {

      console.error(result.error);

      container.innerHTML =
        '<div class="empty">تعذر تحميل النقاشات.</div>';

      return;
    }


    const topics =
      result.data || [];


    if (topics.length === 0) {

      container.innerHTML = `
        <div class="empty">
          لا توجد نقاشات حتى الآن.<br><br>
          كن أول من ينشر موضوعًا!
        </div>
      `;

      return;
    }


    container.innerHTML = "
