<script>

const SUPABASE_URL =
  "https://lcdkvsoztwyuaiizndfl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_hRQIGaC-5q8lhJnMZsWL3Q_B0v6IfDQ";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentCategoryId = null;
let currentTopicId = null;


/* =========================
   TOAST
========================= */

function showToast(message) {

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.style.display = "block";

  setTimeout(function() {

    toast.style.display = "none";

  }, 3500);
}


/* =========================
   MODAL
========================= */

function openModal(id) {

  document.getElementById(id).style.display =
    "flex";
}


function closeModal(id) {

  document.getElementById(id).style.display =
    "none";
}


/* =========================
   AUTH
========================= */

async function openAuthModal() {

  const {
    data: { user }
  } = await db.auth.getUser();

  if (user) {

    showToast(
      "أنت مسجل الدخول بالفعل."
    );

    return;
  }

  openModal("authModal");
}


async function login() {

  const email =
    document.getElementById(
      "authEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "authPassword"
    ).value;

  if (!email || !password) {

    showToast(
      "أدخل البريد الإلكتروني وكلمة المرور."
    );

    return;
  }


  const result =
    await db.auth.signInWithPassword({
      email: email,
      password: password
    });


  if (result.error) {

    console.error(result.error);

    showToast(
      "فشل تسجيل الدخول: " +
      result.error.message
    );

    return;
  }


  closeModal("authModal");

  showToast(
    "تم تسجيل الدخول ✅"
  );

  await updateUserUI();

}


async function logout() {

  const result =
    await db.auth.signOut();


  if (result.error) {

    showToast(
      "تعذر تسجيل الخروج."
    );

    return;
  }


  showToast(
    "تم تسجيل الخروج."
  );

  await updateUserUI();

}


async function updateUserUI() {

  const {
    data: { user }
  } = await db.auth.getUser();


  const authButton =
    document.getElementById(
      "authButton"
    );

  const logoutButton =
    document.getElementById(
      "logoutButton"
    );

  const userInfo =
    document.getElementById(
      "userInfo"
    );


  if (user) {

    authButton.style.display =
      "none";

    logoutButton.style.display =
      "inline-block";

    userInfo.style.display =
      "inline-block";

    userInfo.textContent =
      user.email || "مستخدم";

  } else {

    authButton.style.display =
      "inline-block";

    logoutButton.style.display =
      "none";

    userInfo.style.display =
      "none";
  }

}


/* =========================
   تحميل الأقسام
========================= */

async function loadCategories() {

  const list =
    document.getElementById(
      "categoryList"
    );

  const select =
    document.getElementById(
      "topicCategory"
    );


  if (list) {

    list.innerHTML =
      "جاري تحميل الأقسام...";

  }


  if (select) {

    select.innerHTML =
      '<option value="">جاري تحميل الأقسام...</option>';

  }


  const {
    data,
    error
  } =
    await db
      .from("categories")
      .select(
        "id,name,slug,description"
      )
      .order(
        "id",
        { ascending: true }
      );


  console.log(
    "CATEGORIES DATA:",
    data
  );

  console.log(
    "CATEGORIES ERROR:",
    error
  );


  if (error) {

    console.error(
      "خطأ categories:",
      error
    );


    if (list) {

      list.innerHTML = `
        <div style="color:#ff7070;">
          ❌ تعذر تحميل الأقسام
        </div>
      `;

    }


    if (select) {

      select.innerHTML =
        '<option value="">تعذر تحميل الأقسام</option>';

    }


    return;
  }


  if (!data || data.length === 0) {

    if (list) {

      list.innerHTML =
        "لا توجد أقسام.";

    }


    if (select) {

      select.innerHTML =
        '<option value="">لا توجد أقسام</option>';

    }


    return;
  }


  /* القائمة الجانبية */

  if (list) {

    list.innerHTML = "";


    data.forEach(function(category) {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "category-btn";


      button.textContent =
        "▸ " + category.name;


      button.onclick =
        function() {

          openCategory(
            category.id,
            category.name,
            category.description
          );

        };


      list.appendChild(button);

    });

  }


  /* قائمة إنشاء الموضوع */

  if (select) {

    select.innerHTML =
      '<option value="">اختر القسم</option>';


    data.forEach(function(category) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        category.id;


      option.textContent =
        category.name;


      select.appendChild(option);

    });

  }

}


/* =========================
   المواضيع الرئيسية
========================= */

async function loadTopics() {

  const container =
    document.getElementById(
      "topicsList"
    );


  container.innerHTML =
    '<div class="empty">جاري تحميل النقاشات...</div>';


  const {
    data,
    error
  } =
    await db
      .from("topics")
      .select(
        "id,title,content,created_at,category_id"
      )
      .order(
        "created_at",
        { ascending: false }
      );


  if (error) {

    console.error(error);

    container.innerHTML =
      '<div class="empty">تعذر تحميل النقاشات.</div>';

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML = `
      <div class="empty">
        لا توجد نقاشات حتى الآن.
      </div>
    `;

    return;
  }


  container.innerHTML = "";


  data.forEach(function(topic) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "topic-card";


    card.innerHTML = `
      <h3></h3>
      <div class="topic-preview"></div>
      <div class="topic-meta"></div>
    `;


    card.querySelector("h3")
      .textContent =
      topic.title;


    card.querySelector(
      ".topic-preview"
    ).textContent =
      getPreview(topic.content);


    card.querySelector(
      ".topic-meta"
    ).textContent =
      formatDate(topic.created_at);


    card.onclick =
      function() {

        openTopic(topic.id);

      };


    container.appendChild(card);

  });

}


/* =========================
   فتح القسم
========================= */

async function openCategory(
  categoryId,
  categoryName,
  description
) {

  currentCategoryId =
    categoryId;


  document.getElementById(
    "home"
  ).style.display =
    "none";


  document.getElementById(
    "topicPage"
  ).style.display =
    "none";


  document.getElementById(
    "categoryPage"
  ).style.display =
    "block";


  document.getElementById(
    "categoryTitle"
  ).textContent =
    categoryName;


  document.getElementById(
    "categoryDescription"
  ).textContent
